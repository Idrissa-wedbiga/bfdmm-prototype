services:

  # ══════════════════════════════════════
  # Base de données application BFDMM
  # ══════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: bfdmm-postgres
    environment:
      POSTGRES_DB: bfdmm_db
      POSTGRES_USER: bfdmm_user
      POSTGRES_PASSWORD: bfdmm_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfdmm_user -d bfdmm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bfdmm-network

  # ══════════════════════════════════════
  # Backend Spring Boot
  # ══════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bfdmm-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bfdmm_db
      SPRING_DATASOURCE_USERNAME: bfdmm_user
      SPRING_DATASOURCE_PASSWORD: bfdmm_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://frontend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bfdmm-network

  # ══════════════════════════════════════
  # Frontend Angular (Nginx)
  # ══════════════════════════════════════
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bfdmm-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - bfdmm-network

  # ══════════════════════════════════════
  # Base de données dédiée SonarQube
  # ══════════════════════════════════════
  postgres-sonar:
    image: postgres:16-alpine
    container_name: bfdmm-postgres-sonar
    environment:
      POSTGRES_DB: sonarqube_db
      POSTGRES_USER: sonar_user
      POSTGRES_PASSWORD: sonar_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar_user -d sonarqube_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bfdmm-network

  # ══════════════════════════════════════
  # SonarQube
  # ══════════════════════════════════════
  sonarqube:
    image: sonarqube:community
    container_name: bfdmm-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube_db
      SONAR_JDBC_USERNAME: sonar_user
      SONAR_JDBC_PASSWORD: sonar_pass
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres-sonar:
        condition: service_healthy
    networks:
      - bfdmm-network

networks:
  bfdmm-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions: