services:
  # Base de données application BFDMM
  postgres:
    image: postgres:16-alpine
    container_name: bfdmm-postgres
    environment:
      POSTGRES_DB: bfdmm_db
      POSTGRES_USER: bfdmm_user
      POSTGRES_PASSWORD: bfdmm_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bfdmm_user -d bfdmm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bfdmm-network

  # Base de données dédiée SonarQube
  postgres-sonar:
    image: postgres:16-alpine
    container_name: bfdmm-postgres-sonar
    environment:
      POSTGRES_DB: sonarqube_db
      POSTGRES_USER: sonar_user
      POSTGRES_PASSWORD: sonar_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar_user -d sonarqube_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bfdmm-network

  # SonarQube connecté à sa propre base
  sonarqube:
    image: sonarqube:community
    container_name: bfdmm-sonarqube
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube_db
      SONAR_JDBC_USERNAME: sonar_user
      SONAR_JDBC_PASSWORD: sonar_pass
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres-sonar:
        condition: service_healthy
    networks:
      - bfdmm-network

networks:
  bfdmm-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_sonar_data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
