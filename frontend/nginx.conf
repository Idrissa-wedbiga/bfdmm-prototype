events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Health check pour Docker/Kubernetes
    location /health {
      return 200 'OK';
      add_header Content-Type text/plain;
    }

    # Proxy vers le backend Spring Boot
    # Le frontend appelle /api/* -> redirigé vers backend:8080
    location /api/ {
      proxy_pass         http://backend:8080/api/;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;

      # Timeout généreux pour les requêtes lentes
      proxy_connect_timeout 60s;
      proxy_read_timeout    60s;
    }

    # Proxy vers actuator Spring Boot (optionnel, utile pour debug)
    location /actuator/ {
      proxy_pass http://backend:8080/actuator/;
      proxy_set_header Host $host;
    }

    # Angular : toutes les autres routes -> index.html (SPA routing)
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Headers de sécurité
    add_header X-Frame-Options         "SAMEORIGIN"   always;
    add_header X-Content-Type-Options  "nosniff"      always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "no-referrer"  always;
  }
}
