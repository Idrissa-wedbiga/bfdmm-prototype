<div class="list-container">
  <div class="list-header">
    <h1>Documents</h1>
    <button mat-raised-button color="primary" routerLink="/documents/new">
      <mat-icon>add</mat-icon> Nouveau
    </button>
  </div>

  <table mat-table [dataSource]="documents()" class="full-width">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let doc">{{ doc.id }}</td>
    </ng-container>

    <ng-container matColumnDef="titre">
      <th mat-header-cell *matHeaderCellDef>Titre</th>
      <td mat-cell *matCellDef="let doc">{{ doc.titre }}</td>
    </ng-container>

    <ng-container matColumnDef="ministere">
      <th mat-header-cell *matHeaderCellDef>Ministère</th>
      <td mat-cell *matCellDef="let doc">{{ doc.ministere }}</td>
    </ng-container>

    <ng-container matColumnDef="classification">
      <th mat-header-cell *matHeaderCellDef>Classification</th>
      <td mat-cell *matCellDef="let doc">
        <mat-chip [class]="doc.classification.toLowerCase()">
          {{ doc.classification }}
        </mat-chip>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let doc">
        <button mat-icon-button [routerLink]="['/documents/edit', doc.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="delete(doc.id!)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  @if (documents().length === 0) {
  <p class="empty">Aucun document. <a routerLink="/documents/new">Créer le premier</a></p>
  }
</div>
