name: BFDMM Security Pipeline - Refondu

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-frontend
  NAMESPACE: bfdmm-staging

jobs:

  # ════════════════════════════════════════════════════════════════════
  # STAGE 0 — Threat Modeling STRIDE
  # ════════════════════════════════════════════════════════════════════
  threat-modeling:
    name: "S0 - Threat Modeling STRIDE"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Threat Dragon CLI
        run: npm install -g @threatdragon/cli || true

      - name: Validate threat model
        run: |
          echo "===================================="
          echo " VALIDATION MODELE STRIDE BFDMM"
          echo "===================================="

          if [ -f threat-model/bfdmm-threatmodel.json ]; then
            python3 << 'PYEOF'
          import json

          with open('threat-model/bfdmm-threatmodel.json') as f:
            tm = json.load(f)

          diagrams = tm.get('detail', {}).get('diagrams', [])

          threats = []
          for d in diagrams:
            threats.extend(d.get('threats', []))

          mitigated = sum(1 for t in threats if t.get('status') == 'Mitigated')

          print(f"Total menaces STRIDE : {len(threats)}")
          print(f"Menaces mitigees     : {mitigated}")
          print(f"Couverture           : {mitigated}/{len(threats)}")
          
          if len(threats) > 0 and mitigated/len(threats) < 0.5:
            print("⚠️ ATTENTION : Moins de 50% des menaces mitigées")
            exit(1)
          PYEOF
          else
            echo "ERREUR : threat-model/bfdmm-threatmodel.json absent"
            exit 1
          fi

      - name: Upload threat model
        uses: actions/upload-artifact@v4
        with:
          name: threat-model-report
          path: threat-model/


  # ════════════════════════════════════════════════════════════════════
  # STAGE 1 — Build + SAST (Backend + Frontend)
  # ════════════════════════════════════════════════════════════════════
  build-and-sast:
    name: "S1 - Build et SAST"
    needs: threat-modeling
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ════════════════════════════════════════════
      # BACKEND - Build + SonarCloud
      # ════════════════════════════════════════════
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build Spring Boot backend
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: SonarCloud Scan - Backend
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ════════════════════════════════════════════
      # FRONTEND - Build + SonarCloud
      # ════════════════════════════════════════════
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}

      - name: Build Angular frontend
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production

      - name: SonarCloud Scan - Frontend
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      # ════════════════════════════════════════════
      # EXPORT DES RAPPORTS
      # ════════════════════════════════════════════
      - name: Export SonarQube reports
        if: always()
        run: |
          pip install requests --quiet
          python3 << 'PYEOF'
          import requests, json, os

          token   = os.environ.get("SONAR_TOKEN", "")
          host    = "https://sonarcloud.io"
          projects = ["backend", "frontend"]
          metrics = "bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,security_hotspots,sqale_index"

          for project in projects:
              r = requests.get(
                  f"{host}/api/measures/component",
                  params={"component": project, "metricKeys": metrics},
                  auth=(token, ""),
                  timeout=30,
              )

              if r.status_code == 200:
                  with open(f"sonar-{project}.json", "w") as f:
                      json.dump(r.json(), f, ensure_ascii=False, indent=2)
                  print(f"Rapport SonarQube {project} exporté")
              else:
                  print(f"Erreur {project} : HTTP {r.status_code}")
          PYEOF
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate SonarQube HTML report
        if: always()
        run: |
          python3 << 'PYEOF'
          import json

          projects = ["backend", "frontend"]

          html = """<!DOCTYPE html>
          <html lang="fr">
          <head><meta charset="UTF-8">
          <title>BFDMM — Rapport SonarQube</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 2em; background:#f9f9f9; }
            h1 { color: #1a73e8; }
            table { border-collapse: collapse; width: 100%; }
            th, td { border:1px solid #ccc; padding:8px 14px; text-align:left; }
            th { background:#1a73e8; color:white; }
            tr:nth-child(even) { background:#e8f0fe; }
          </style>
          </head>
          <body>
          <h1>🛡️ BFDMM — Rapport SonarQube</h1>
          <table>
            <tr><th>Métrique</th><th>Backend</th><th>Frontend</th></tr>
          """

          def get_value(project, key):
              try:
                  with open(f"sonar-{project}.json") as f:
                      data = json.load(f)
                  for m in data.get("component", {}).get("measures", []):
                      if m["metric"] == key:
                          return m.get("value", "N/A")
              except:
                  pass
              return "N/A"

          metrics_display = [
              ("Bugs", "bugs"),
              ("Vulnérabilités", "vulnerabilities"),
              ("Code Smells", "code_smells"),
              ("Couverture tests (%)", "coverage"),
              ("Duplication (%)", "duplicated_lines_density"),
              ("Security Hotspots", "security_hotspots"),
              ("Dette technique (min)", "sqale_index"),
          ]

          for label, key in metrics_display:
              v1 = get_value("backend", key)
              v2 = get_value("frontend", key)
              html += f"<tr><td>{label}</td><td>{v1}</td><td>{v2}</td></tr>\n"

          html += """</table></body></html>"""

          with open("sonar-report.html", "w") as f:
              f.write(html)
          print("sonar-report.html généré")
          PYEOF

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report
          path: |
            sonar-backend.json
            sonar-frontend.json
            sonar-report.html


  # ════════════════════════════════════════════════════════════════════
  # STAGE 2 — SCA Trivy - Dépendances (Backend + Frontend)
  # ════════════════════════════════════════════════════════════════════
  sca-analysis:
    name: "S2 - SCA Dépendances"
    needs: build-and-sast
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ---- BACKEND (Maven) ----
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Maven dependencies
        run: |
          cd backend
          mvn dependency:resolve dependency:resolve-plugins -B -q

      - name: Download Trivy HTML template
        run: |
          curl -sSL -o html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      - name: Trivy scan - Backend dependencies (pom.xml)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'json'
          output: 'trivy-backend-sca.json'

      # ---- FRONTEND (npm) ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: |
          cd frontend
          npm ci

      - name: Trivy scan - Frontend dependencies (package.json)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'json'
          output: 'trivy-frontend-sca.json'

      - name: Generate SCA summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json

          def summarize(name, file):
              try:
                  with open(file) as f:
                      data = json.load(f)
              except:
                  print(f"{name} : fichier non trouvé")
                  return

              counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}

              for result in data.get('Results', []):
                  for vuln in result.get('Vulnerabilities', []):
                      sev = vuln.get('Severity', 'LOW')
                      counts[sev] = counts.get(sev, 0) + 1

              print(f"\n=== {name} ===")
              print(f"CRITICAL : {counts['CRITICAL']}")
              print(f"HIGH     : {counts['HIGH']}")
              print(f"MEDIUM   : {counts['MEDIUM']}")
              print(f"LOW      : {counts['LOW']}")
              print(f"TOTAL    : {sum(counts.values())}")

          summarize("BACKEND SCA", "trivy-backend-sca.json")
          summarize("FRONTEND SCA", "trivy-frontend-sca.json")
          PYEOF

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: |
            trivy-backend-sca.json
            trivy-frontend-sca.json


  # ════════════════════════════════════════════════════════════════════
  # STAGE 3 — Build des images Docker (Backend + Frontend)
  # ════════════════════════════════════════════════════════════════════
  build-images:
    name: "S3 - Build Images Docker"
    needs: sca-analysis
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Build backend image
        run: |
          docker build \
            --no-cache \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t bfdmm-backend:${{ github.sha }} \
            backend/

      - name: Build frontend image
        run: |
          docker build \
            --no-cache \
            --label "git-commit=${{ github.sha }}" \
            --label "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t bfdmm-frontend:${{ github.sha }} \
            frontend/

      - name: Save images to artifact
        run: |
          docker save bfdmm-backend:${{ github.sha }} -o backend-image.tar
          docker save bfdmm-frontend:${{ github.sha }} -o frontend-image.tar

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-image.tar
            frontend-image.tar


  # ════════════════════════════════════════════════════════════════════
  # STAGE 4 — Scan des images Docker avec Trivy (STAGE DÉDIÉ)
  # ════════════════════════════════════════════════════════════════════
  scan-images:
    name: "S4 - Scan (Trivy) Images Docker"
    needs: build-images
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: |
          docker load -i backend-image.tar
          docker load -i frontend-image.tar
          docker images

      - name: Download Trivy HTML template
        run: |
          curl -sSL -o html.tpl \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl

      # ---- SCAN BACKEND IMAGE ----
      - name: Trivy scan - Backend image (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-backend:${{ github.sha }}'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'json'
          output: 'trivy-backend-image.json'

      - name: Trivy scan - Backend image (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-backend:${{ github.sha }}'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-backend-image.html'

      # ---- SCAN FRONTEND IMAGE ----
      - name: Trivy scan - Frontend image (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-frontend:${{ github.sha }}'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'json'
          output: 'trivy-frontend-image.json'

      - name: Trivy scan - Frontend image (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-frontend:${{ github.sha }}'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'template'
          template: '@html.tpl'
          output: 'trivy-frontend-image.html'

      # ---- STATISTIQUES ----
      - name: Generate image scan summary
        if: always()
        run: |
          python3 << 'PYEOF'
          import json

          def summarize_images(name, file):
              try:
                  with open(file) as f:
                      data = json.load(f)
              except:
                  print(f"{name} : fichier non trouvé")
                  return

              counts = {'CRITICAL': 0, 'HIGH': 0, 'MEDIUM': 0, 'LOW': 0}

              for result in data.get('Results', []):
                  for vuln in result.get('Vulnerabilities', []):
                      sev = vuln.get('Severity', 'LOW')
                      counts[sev] = counts.get(sev, 0) + 1

              print(f"\n=== {name} ===")
              print(f"CRITICAL : {counts['CRITICAL']}")
              print(f"HIGH     : {counts['HIGH']}")
              print(f"MEDIUM   : {counts['MEDIUM']}")
              print(f"LOW      : {counts['LOW']}")
              print(f"TOTAL    : {sum(counts.values())}")

          summarize_images("BACKEND IMAGE", "trivy-backend-image.json")
          summarize_images("FRONTEND IMAGE", "trivy-frontend-image.json")
          PYEOF

      # ---- PUSH VERS LE REGISTRE (si scan OK) ----
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push images to registry
        if: github.ref == 'refs/heads/main'
        run: |
          # Vérifier qu'il n'y a pas de vulnérabilités CRITICAL
          CRITICAL_BACKEND=$(python3 -c "import json; data=json.load(open('trivy-backend-image.json')); print(sum(1 for r in data.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "0")
          CRITICAL_FRONTEND=$(python3 -c "import json; data=json.load(open('trivy-frontend-image.json')); print(sum(1 for r in data.get('Results',[]) for v in r.get('Vulnerabilities',[]) if v.get('Severity')=='CRITICAL'))" 2>/dev/null || echo "0")

          if [ "$CRITICAL_BACKEND" -gt 0 ] || [ "$CRITICAL_FRONTEND" -gt 0 ]; then
            echo "⚠️ Vulnérabilités CRITICAL détectées - push annulé"
            echo "Backend CRITICAL: $CRITICAL_BACKEND"
            echo "Frontend CRITICAL: $CRITICAL_FRONTEND"
            exit 1
          fi

          docker tag bfdmm-backend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker tag bfdmm-frontend:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Upload container scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-report
          path: |
            trivy-backend-image.json
            trivy-backend-image.html
            trivy-frontend-image.json
            trivy-frontend-image.html


  # ════════════════════════════════════════════════════════════════════
  # STAGE 5 — Deploy K3s (Backend + Frontend)
  # ════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: "S5 - Deploy K3s"
    needs: scan-images
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: bfdmm-staging

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} || true

      # ---- DEPLOIEMENT BACKEND ----
      - name: Deploy backend
        run: |
          kubectl create deployment bfdmm-backend \
            --image=bfdmm-backend:${{ github.sha }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl expose deployment bfdmm-backend \
            --type=ClusterIP \
            --port=8080 \
            --target-port=8080 \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---- DEPLOIEMENT FRONTEND ----
      - name: Deploy frontend
        run: |
          kubectl create deployment bfdmm-frontend \
            --image=bfdmm-frontend:${{ github.sha }} \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl expose deployment bfdmm-frontend \
            --type=NodePort \
            --port=80 \
            --target-port=80 \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # ---- VÉRIFICATION ----
      - name: Wait for deployments
        run: |
          kubectl wait deployment/bfdmm-backend \
            --for=condition=available \
            --timeout=120s \
            -n ${{ env.NAMESPACE }} || true

          kubectl wait deployment/bfdmm-frontend \
            --for=condition=available \
            --timeout=120s \
            -n ${{ env.NAMESPACE }} || true

      - name: Get deployment status
        run: |
          echo "========================================"
          echo "  BFDMM - DEPLOYMENT STATUS"
          echo "========================================"
          echo ""
          echo "=== PODS ==="
          kubectl get pods -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== SERVICES ==="
          kubectl get services -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== DEPLOYMENTS ==="
          kubectl get deployments -n ${{ env.NAMESPACE }}

      - name: Port-forward for testing
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} \
            service/bfdmm-backend 8080:8080 &


  # ════════════════════════════════════════════════════════════════════
  # STAGE 6 — DAST OWASP ZAP (Backend + Frontend déployés)
  # ════════════════════════════════════════════════════════════════════
  dast-scan:
    name: "S6 - DAST OWASP ZAP"
    needs: deploy-staging
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Get service IPs
        run: |
          kubectl get services -n ${{ env.NAMESPACE }}

      - name: Port-forward backend
        run: |
          kubectl port-forward -n ${{ env.NAMESPACE }} \
            service/bfdmm-backend 8080:8080 &
          sleep 10

      - name: Test backend connectivity
        run: |
          curl -sf http://localhost:8080/actuator/health || echo "Backend health check failed"

      - name: Fix ZAP workspace permissions
        run: sudo chmod -R 777 ${{ github.workspace }}

      # ---- ZAP BACKEND ----
      - name: OWASP ZAP - Backend
        run: |
          docker run --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8080 \
              -r zap-backend-report.html \
              -J zap-backend-report.json \
              -w zap-backend-report.md \
              -a -I || true

      - name: ZAP summary - Backend
        if: always()
        run: |
          if [ -f zap-backend-report.json ]; then
            python3 << 'PYEOF'
          import json
          with open('zap-backend-report.json') as f:
              data = json.load(f)
          counts = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}
          for alert in data.get('site', [{}])[0].get('alerts', []):
              risk = alert.get('riskdesc', '').split(' ')[0]
              if risk in counts:
                  counts[risk] += 1
          print("\n=== ZAP BACKEND ===")
          print(f"High          : {counts['High']}")
          print(f"Medium        : {counts['Medium']}")
          print(f"Low           : {counts['Low']}")
          print(f"Informational : {counts['Informational']}")
          print(f"TOTAL         : {sum(counts.values())}")
          PYEOF
          fi

      # ---- ZAP FRONTEND ----
      - name: Get frontend NodePort
        run: |
          NODEPORT=$(kubectl get service bfdmm-frontend -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.ports[0].nodePort}')
          echo "NODEPORT=${NODEPORT:-80}" >> $GITHUB_ENV

      - name: OWASP ZAP - Frontend
        run: |
          docker run --network=host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:${{ env.NODEPORT }} \
              -r zap-frontend-report.html \
              -J zap-frontend-report.json \
              -w zap-frontend-report.md \
              -a -I || true

      - name: ZAP summary - Frontend
        if: always()
        run: |
          if [ -f zap-frontend-report.json ]; then
            python3 << 'PYEOF'
          import json
          with open('zap-frontend-report.json') as f:
              data = json.load(f)
          counts = {'High': 0, 'Medium': 0, 'Low': 0, 'Informational': 0}
          for alert in data.get('site', [{}])[0].get('alerts', []):
              risk = alert.get('riskdesc', '').split(' ')[0]
              if risk in counts:
                  counts[risk] += 1
          print("\n=== ZAP FRONTEND ===")
          print(f"High          : {counts['High']}")
          print(f"Medium        : {counts['Medium']}")
          print(f"Low           : {counts['Low']}")
          print(f"Informational : {counts['Informational']}")
          print(f"TOTAL         : {sum(counts.values())}")
          PYEOF
          fi

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap-backend-report.html
            zap-backend-report.json
            zap-backend-report.md
            zap-frontend-report.html
            zap-frontend-report.json
            zap-frontend-report.md


  # ════════════════════════════════════════════════════════════════════
