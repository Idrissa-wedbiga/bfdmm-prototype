  name: BFDMM Security Pipeline

  on:
    push:
      branches: [ main, develop ]
    pull_request:
      branches: [ main ]

  env:
    REGISTRY: docker.io
    BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-backend
    FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-frontend

  jobs:

    # ══════════════════════════════════════════
    # STAGE 0 — Threat Modeling STRIDE
    # ══════════════════════════════════════════
    threat-modeling:
      name: "S0 - Threat Modeling STRIDE"
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Install Threat Dragon CLI
          run: |
            npm install -g @threatdragon/cli 2>/dev/null || true

        - name: Validate threat model exists
          run: |
            if [ ! -f threat-model/bfdmm-threatmodel.json ]; then
              echo "AVERTISSEMENT: Modele de menaces absent"
              echo "Créer threat-model/bfdmm-threatmodel.json"
              mkdir -p threat-model
              echo '{"summary":{"title":"BFDMM Threat Model",
              "owner":"BFDMM","description":"Modele STRIDE"},
              "detail":{"contributors":[],"diagrams":[]}}' \
              > threat-model/bfdmm-threatmodel.json
            fi
            echo "Modele de menaces present"
            cat threat-model/bfdmm-threatmodel.json

        - name: Upload threat model
          uses: actions/upload-artifact@v4
          with:
            name: threat-model
            path: threat-model/

    # ══════════════════════════════════════════
    # STAGE 1 — Build + SAST SonarQube
    # ══════════════════════════════════════════
    build-and-sast:
      name: "S1 - Build et SAST"
      needs: threat-modeling
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'

        - name: Cache Maven
          uses: actions/cache@v4
          with:
            path: ~/.m2
            key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

        - name: Build Spring Boot
          run: |
            cd backend
            mvn clean package -DskipTests
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV

        - name: SonarCloud Scan
          uses: SonarSource/sonarqube-scan-action@v2
          with:
            projectBaseDir: backend
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_HOST_URL: https://sonarcloud.io

        - name: Upload JAR
          uses: actions/upload-artifact@v4
          with:
            name: backend-jar
            path: backend/target/*.jar

    # ══════════════════════════════════════════
    # STAGE 2 — SCA (Dépendances)
    # ══════════════════════════════════════════
    sca-analysis:
      name: "S2 - Analyse dependances SCA"
      needs: build-and-sast
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'

        - name: OWASP Dependency-Check
          uses: dependency-check/Dependency-Check_Action@main
          with:
            project: 'bfdmm-prototype'
            path: 'backend'
            format: 'HTML'
            out: 'reports/dependency-check'
            args: "--failOnCVSS 7 --enableRetired"

        - name: Trivy filesystem scan
          uses: aquasecurity/trivy-action@master
          with:
            scan-type: 'fs'
            scan-ref: 'backend'
            severity: 'HIGH,CRITICAL'
            exit-code: '1'
            format: 'table'

        - name: Upload SCA reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: sca-reports
            path: reports/

    # ══════════════════════════════════════════
    # STAGE 3 — Build Docker + Scan Trivy
    # ══════════════════════════════════════════
    containerize:
      name: "S3 - Containerisation securisee"
      needs: sca-analysis
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Download JAR
          uses: actions/download-artifact@v4
          with:
            name: backend-jar
            path: backend/target/

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'

        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'

        - name: Build Angular
          run: |
            cd frontend
            npm ci
            npm run build -- --configuration=production

        - name: Build backend Docker image
          run: |
            docker build \
              --no-cache \
              --label "git-commit=${{ github.sha }}" \
              -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
              -t ${{ env.BACKEND_IMAGE }}:latest \
              backend/

        - name: Build frontend Docker image
          run: |
            docker build \
              --no-cache \
              --label "git-commit=${{ github.sha }}" \
              -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
              -t ${{ env.FRONTEND_IMAGE }}:latest \
              frontend/

        - name: Trivy scan backend image
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: '${{ env.BACKEND_IMAGE }}:${{ github.sha }}'
            severity: 'HIGH,CRITICAL'
            exit-code: '1'
            format: 'table'

        - name: Trivy scan frontend image
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: '${{ env.FRONTEND_IMAGE }}:${{ github.sha }}'
            severity: 'HIGH,CRITICAL'
            exit-code: '1'
            format: 'table'

        - name: Push images to Docker Hub
          if: github.ref == 'refs/heads/main'
          run: |
            echo "${{ secrets.DOCKER_PASSWORD }}" \
              | docker login -u "${{ secrets.DOCKER_USERNAME }}" \
              --password-stdin
            docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            docker push ${{ env.BACKEND_IMAGE }}:latest
            docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            docker push ${{ env.FRONTEND_IMAGE }}:latest

    # ══════════════════════════════════════════
    # STAGE 4 — Deploy K3s Staging
    # ══════════════════════════════════════════
    deploy-staging:
      name: "S4 - Deploy K3s staging"
      needs: containerize
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v4

        - name: Configure kubectl
          run: |
            mkdir -p ~/.kube
            echo "${{ secrets.KUBECONFIG }}" \
              | base64 -d > ~/.kube/config
            chmod 600 ~/.kube/config

        - name: Deploy to staging
          run: |
            kubectl set image deployment/bfdmm-backend \
              backend=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
              -n bfdmm-staging 2>/dev/null || \
            kubectl create deployment bfdmm-backend \
              --image=${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
              -n bfdmm-staging
            
            kubectl set image deployment/bfdmm-frontend \
              frontend=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
              -n bfdmm-staging 2>/dev/null || \
            kubectl create deployment bfdmm-frontend \
              --image=${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
              -n bfdmm-staging

        - name: Wait for rollout
          run: |
            kubectl rollout status deployment/bfdmm-backend \
              -n bfdmm-staging --timeout=3m || true
            kubectl rollout status deployment/bfdmm-frontend \
              -n bfdmm-staging --timeout=3m || true

    # ══════════════════════════════════════════
    # STAGE 5 — DAST OWASP ZAP
    # ══════════════════════════════════════════
    dast-scan:
      name: "S5 - Tests dynamiques DAST"
      needs: deploy-staging
      runs-on: ubuntu-latest
      if: github.ref == 'refs/heads/main'
      steps:
        - uses: actions/checkout@v4

        - name: OWASP ZAP Baseline Scan
          uses: zaproxy/action-baseline@v0.12.0
          with:
            target: 'http://localhost:8080'
            fail_action: false
            cmd_options: '-a'

        - name: Upload ZAP report
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: zap-report
            path: report_html.html

    # ══════════════════════════════════════════
    # STAGE 6 — Résumé sécurité
    # ══════════════════════════════════════════
    security-summary:
      name: "S6 - Resume securite BFDMM"
      needs: [threat-modeling, build-and-sast, sca-analysis, containerize]
      runs-on: ubuntu-latest
      if: always()
      steps:
        - name: Resume pipeline BFDMM
          run: |
            echo "======================================"
            echo "  BFDMM Security Pipeline Summary"
            echo "======================================"
            echo "S0 Threat Modeling : ${{ needs.threat-modeling.result }}"
            echo "S1 Build + SAST    : ${{ needs.build-and-sast.result }}"
            echo "S2 SCA Dependances : ${{ needs.sca-analysis.result }}"
            echo "S3 Containerisation: ${{ needs.containerize.result }}"
            echo "======================================"
            echo "Commit : ${{ github.sha }}"
            echo "Branch : ${{ github.ref_name }}"
            echo "Date   : $(date -u)"
            echo "======================================"