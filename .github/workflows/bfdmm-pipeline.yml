
name: BFDMM Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/bfdmm-frontend

jobs:

  # ══════════════════════════════════════
  # STAGE 0 — Threat Modeling STRIDE
  # ══════════════════════════════════════
  threat-modeling:
    name: "S0 - Threat Modeling STRIDE"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Threat Dragon CLI
        run: |
          npm install -g @threatdragon/cli || true

      - name: Validate threat model
        run: |
          echo "===================================="
          echo " VALIDATION MODELE STRIDE BFDMM"
          echo "===================================="
          
          if [ -f threat-model/bfdmm-threatmodel.json ]; then
          
            python3 << 'PYEOF'
          import json
          
          with open('threat-model/bfdmm-threatmodel.json') as f:
            tm = json.load(f)
          
          diagrams = tm.get('detail', {}).get('diagrams', [])
          
          threats = []
          for d in diagrams:
            threats.extend(d.get('threats', []))
          
          mitigated = sum(
          1 for t in threats
          if t.get('status') == 'Mitigated'
          )
          
          print(f"Total menaces STRIDE : {len(threats)}")
          print(f"Menaces mitigees     : {mitigated}")
          print(f"Couverture           : {mitigated}/{len(threats)}")
          PYEOF
          
          else
            echo "ERREUR : threat-model/bfdmm-threatmodel.json absent"
          exit 1
          fi

      - name: Upload threat model
        uses: actions/upload-artifact@v4
        with:
          name: threat-model-report
          path: threat-model/

# ══════════════════════════════════════
# STAGE 1 — Build + SAST SonarCloud
# ══════════════════════════════════════
  build-and-sast:
    name: "S1 - Build et SAST"
    needs: threat-modeling
    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build Spring Boot
        run: |
          cd backend
          mvn clean package -DskipTests

      - name: Copy Maven dependencies
        run: |
          cd backend
          mvn dependency:copy-dependencies

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        with:
          projectBaseDir: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar

  # ══════════════════════════════════════
  # STAGE 2 — SCA Trivy Audit
  # ══════════════════════════════════════
  sca-analysis:
    name: "S2 - Analyse SCA"
    needs: build-and-sast
    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Trivy filesystem scan (table)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Trivy filesystem scan (JSON)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          exit-code: '0'
          format: 'json'
          output: 'trivy-sca.json'

      - name: Generate CVE statistics
        if: always()
        run: |
          if [ -f trivy-sca.json ]; then
          
             python3 << 'PYEOF'
          import json
          
          with open('trivy-sca.json') as f:
             data = json.load(f)
          
          counts = {
            'CRITICAL': 0,
            'HIGH': 0,
            'MEDIUM': 0,
            'LOW': 0
          }
          
          for result in data.get('Results', []):
            for vuln in result.get('Vulnerabilities', []):
          
              sev = vuln.get('Severity', 'LOW')
          
              if sev not in counts:
                counts[sev] = 0
          
              counts[sev] += 1
          
          print("=" * 45)
          print(" BFDMM — RAPPORT SCA / CVE")
          print("=" * 45)
          
          for sev, count in counts.items():
            print(f"{sev:10} : {count}")
          
          print("=" * 45)
          print(f"TOTAL : {sum(counts.values())}")
          print("=" * 45)
          PYEOF
          
          fi

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-report
          path: trivy-sca.json

  # ══════════════════════════════════════
  # STAGE 3 — Containerisation Sécurisée
  # ══════════════════════════════════════
  containerize:
    name: "S3 - Containerisation"
    needs: sca-analysis
    runs-on: ubuntu-latest

    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Angular frontend
        run: |
          cd frontend
          npm ci
          npm run build -- --configuration=production

      - name: Build backend Docker image
        run: |
          docker build \
            --no-cache \
            --label "git-commit=${{ github.sha }}" \
            -t bfdmm-backend:${{ github.sha }} \
            backend/

      - name: Build frontend Docker image
        run: |
          docker build \
            --no-cache \
            --label "git-commit=${{ github.sha }}" \
            -t bfdmm-frontend:${{ github.sha }} \
            frontend/

      - name: Trivy backend image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-backend:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

      - name: Trivy frontend image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bfdmm-frontend:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          format: 'table'

  # ══════════════════════════════════════
  # STAGE 4 — Déploiement K3s
  # ══════════════════════════════════════
  deploy-staging:
    name: "S4 - Deploy K3s"
    needs: containerize
    runs-on: ubuntu-latest

    #if: github.ref == 'refs/heads/main'

    continue-on-error: true

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: bfdmm-staging

      - name: Create namespace
        run: kubectl create namespace bfdmm-staging

      - name: Deploy backend (dry-run)
        run: |
          kubectl create deployment bfdmm-backend \
            --image=nginx:alpine \
            --namespace=bfdmm-staging
          kubectl get deployments -n bfdmm-staging

      - name: Verify deployment
        run: |
          kubectl wait deployment/bfdmm-backend \
            --for=condition=available \
            --timeout=60s \
            -n bfdmm-staging
          echo "Deploy OK"

  # ==========================================
  # STAGE 5 - DAST OWASP ZAP
  # ==========================================
  dast-scan:
    name: "S5 - DAST OWASP ZAP"
    needs: sca-analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      issues: write
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bfdmm_db
          POSTGRES_USER: bfdmm_user
          POSTGRES_PASSWORD: bfdmm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Spring Boot
        run: |
          cd backend
          mvn clean package -DskipTests -q

      - name: Start Spring Boot app
        run: |
          cd backend
          nohup java -jar target/*.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/bfdmm_db \
            --spring.datasource.username=bfdmm_user \
            --spring.datasource.password=bfdmm_pass \
            > /tmp/app.log 2>&1 &

          echo "Attente demarrage Spring Boot..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "App demarree apres ${i}x2s"
              curl http://localhost:8080/actuator/health
              break
            fi
            sleep 2
          done

          curl -f http://localhost:8080/actuator/health || {
            echo "ERREUR : app non demarree - logs :"
            cat /tmp/app.log
            exit 1
          }

      - name: Fix ZAP workspace permissions
        run: sudo chmod -R 777 ${{ github.workspace }}

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        env:
          ACTIONS_RUNTIME_URL: ""
          ACTIONS_RUNTIME_TOKEN: ""
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:8080'
          fail_action: false
          cmd_options: '-a'

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            report_html.html
            report_json.json
            report_md.md

  # ══════════════════════════════════════
  # STAGE 6 — Résumé Final BFDMM
  # ══════════════════════════════════════
  security-summary:
    name: "S6 - Resume securite"
    needs:
      [
        threat-modeling,
        build-and-sast,
        sca-analysis,
        containerize,
        deploy-staging,
        dast-scan
      ]

    runs-on: ubuntu-latest

    if: always()

    steps:
      - name: Generate BFDMM summary
        run: |
          echo "=========================================="
          echo "  BFDMM SECURITY PIPELINE SUMMARY"
          echo "=========================================="
          
          echo ""
          echo "S0 Threat Modeling : ${{ needs.threat-modeling.result }}"
          echo "S1 Build + SAST    : ${{ needs.build-and-sast.result }}"
          echo "S2 SCA Analysis    : ${{ needs.sca-analysis.result }}"
          echo "S3 Container Scan  : ${{ needs.containerize.result }}"
          echo "S4 Deploy K3s      : ${{ needs.deploy-staging.result }}"
          echo "S5 DAST OWASP ZAP  : ${{ needs.dast-scan.result }}"
          
          echo ""
          echo "Commit : ${{ github.sha }}"
          echo "Branch : ${{ github.ref_name }}"
          echo "Date   : $(date -u)"
          
          echo ""
          echo "Mode pipeline : AUDIT / RESEARCH"
          echo "Framework     : BFDMM"
          echo "Maturity      : N1 -> N3"
          
          echo "=========================================="
      
