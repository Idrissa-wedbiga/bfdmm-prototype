# Politique staging — trafic contrôlé
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bfdmm-network-policy
  namespace: bfdmm-staging
spec:
  podSelector:
    matchLabels:
      app: bfdmm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app: bfdmm
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4200
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              app: bfdmm
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# Politique prod — plus restrictive
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bfdmm-network-policy
  namespace: bfdmm-prod
spec:
  podSelector:
    matchLabels:
      app: bfdmm
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              env: production
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 4200
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
